name: dinocord

services:
  postgres:
    image: postgres:17
    container_name: dinocord-postgres
    restart: unless-stopped
    environment:
      # These must match ConnectionStrings:DefaultConnection in appsettings.json.
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: custom_chat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d custom_chat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
