# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Chat-backend

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 1. Compilar la aplicación primero
      - name: Build with dotnet
        run: dotnet build --configuration Release

      # 2. 💡 INSTALAR HERRAMIENTA EF (Faltaba este paso)
      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      # 3. 🐘 APLICAR MIGRACIONES (Movido aquí por seguridad)
      - name: Apply Migrations to Neon DB
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING_PROD }}
        run: |
          dotnet ef database update --configuration Release -- --connection-string-parameter "Pooling=false"

      # 4. Publicar y empaquetar si la migración fue exitosa
      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_232F418A987C49A8B559BF2DD6BEF346 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B3063C50CDF34A6D93CD9A0E65086118 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6A10BB1BA7F443DA1ED8D127621C759 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Chat-backend'
          slot-name: 'Production'
          package: .
